server:
  address: 127.0.0.1
  port: 9099

spring:
  application:
    name: starlineagent-mcp-server

starlineagent:
  artist-event-search:
    stale-hours: 168
    max-items: 50
    max-queries: 6
    max-pages-per-query: 2
    max-page-size: 20
    max-raw-results: 200
    discovery-window: year
    discovery-timeout-millis: 8000
