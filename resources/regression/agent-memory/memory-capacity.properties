# R5 容量上界语料：灌满注入块，逼出受限合并
#
# entry.*        按键名排序依次灌库，灌到再多一条就越界为止
#                前六条是这条用例的判据，必须排在最前保证一定进得去；其余都是高度冗余的跑步与健身偏好，
#                互相之间大量重叠，正是合并该下手的地方
# independent.*  绝不该被合并掉的独立记忆，取值是它在 entry 里的唯一关键词
# retract-marker 灌库之后被人工撤回的那条的唯一关键词，合并只许读生效集，它不许被并回来
# ask.*          灌满之后说的新事实，每句都点名调用整理工具，逼出一次抽取 + 一次受限合并

