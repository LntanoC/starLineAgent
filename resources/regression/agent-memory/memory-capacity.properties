# --- 灌满之后的新事实，每句都逼一次 flush ---
# 前三句都是语料里没有的独立新事，只能落成新增；换成改写既有偏好的话，
# 那一批预演字符不长，顶不破上限，受限合并就不会被叫起来
ask.01=记一下：我最近开始学游泳，每周去泳池两次，教练姓周。请立刻调用记忆整理工具存下来。
ask.02=再记一下：我买了一辆折叠自行车，牌子是大行，周末骑车通勤。请立刻调用记忆整理工具存下来。
ask.03=还有：我报名了十一月的城市定向越野赛，队友一共三个人。请立刻调用记忆整理工具存下来。
# 第四句一口气说十六件互不相干的新事：小批次淘一两条就够装下，看不出「满了还能继续记」的量级，
# 这一批要淘掉十几条存量才腾得出位置，淘汰真正在干活是这里看出来的
ask.04=最后一次性记全，都是新事：我老家在安庆，父母至今住在那边的老房子里；我的血型是 A 型 Rh 阳性；我现在用的手机是一台用了三年的 iPhone 13；我常去的理发店就开在公司楼下的商场负一层；我从来不喝咖啡，只喝茶，尤其偏爱熟普洱；我配的是渐进多焦点眼镜，度数每年复查一次；我在阳台养了一盆两米高的龟背竹；我出差一律坐高铁，能不坐飞机就不坐；我的行李箱是二十寸的登机箱，深灰色；我打车只用滴滴，别的软件一概不装；我孩子今年上小学三年级，在城东那所实验小学；我爱人的职业是会计，在一家事务所做审计；我周末常去的公园叫菱湖公园，离家两公里；我从二〇一九年开始记账，用的是随手记；我对青霉素过敏，看病时每次都要主动说明；我的驾照是二〇一五年考出来的，一直没出过险。请立刻调用记忆整理工具把这些全部存下来。
# 末句体量必须大过「上限 - 停手水位」那一段（生产 1500，调试值 375），停手水位才轮得到：
# 小批次永远在「够装下」那一步就先停手，下限那道判断根本执行不到，回滚掉它也变不了红。
# 这一批淘到下限仍装不下，预期走容量拒收——整个事务回滚、水位不推进、模型如实答没记住
ask.05=还有一批也一起记了：我大学读的是自动化专业，二〇一二年毕业；我住的小区叫锦绣花园，二〇一八年买的；我上下班坐地铁二号线，单程四十分钟；我用的笔记本是一台十四寸的联想；我不吃香菜，点外卖每次都备注；我常用的邮箱后缀是 outlook；我签字用零点五的黑色签字笔；我家里不用空调扇，只用中央空调；我每年清明都要回老家扫墓；我最喜欢的电影类型是纪录片；我睡觉必须全关灯，留一点光都睡不着；我用的是青轴机械键盘；我看书偏爱纸质书，很少用电子阅读器；我不参加公司团建的酒局，只去吃饭那一场；我常去的超市是家门口的永辉；我手机铃声一直用默认那个；我夏天开车不开天窗，怕晒；我给孩子报的兴趣班是围棋；我理财只买货币基金，不碰股票；我出门必带一把折叠伞放在包里；我电脑装的是 Windows 11；我常听本地的交通广播电台；我习惯每周日晚上剪指甲；我家宽带是电信的五百兆。请立刻调用记忆整理工具把这些也全部存下来。
