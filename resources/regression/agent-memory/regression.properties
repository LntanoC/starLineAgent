# Agent 记忆回归台配置
# 服务地址、PostgreSQL 账号、记忆阈值全部来自这份 yaml，回归台不另存一份，避免与服务端口径打架
application.config=../../../bootstrap/src/main/resources/application.yaml

# 回归台使用的登录账号；记忆按 userId + conversationId 分片，换账号即换一整套状态
auth.username=admin
auth.password=admin

# HTTP 客户端超时
server.connect-timeout-seconds=5
server.request-timeout-seconds=120

# 数据库连接来自 application.yaml，这里只配超时
database.connect-timeout-seconds=5
database.statement-timeout-seconds=120

# 单轮 SSE 超时要大于服务端 agent.sse-timeout-ms，否则先断在客户端
turn.timeout-seconds=900
# 轮次之间的间隔，给服务端把状态写回 t_agent_state 的时间
turn.interval-seconds=2
# 状态落库是流结束后的异步收尾，读不到就退避重读，读满这个次数仍为空才判失败
probe.max-attempts=5
probe.retry-interval-seconds=2

# 回归台不删任何数据：会话留着才能用 AgentMemoryProbeMain 反复复查同一条状态，要清理请从前端删
# 加 --verbose 可以顺带打印每轮回答，判断模型是真记得还是蒙对了关键词
