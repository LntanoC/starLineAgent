# Agent 记忆回归剧本
#
# 按 turn.refs 的顺序串行提问，上一轮读完 SSE 才发下一轮，顺序不随机——记忆验证本身就依赖先后。
#
# anchor    贯穿全场的锚点事实，判定「记不记得」全靠它；必须是知识库里查不到的内容
# session   main=复用主会话（同一个 conversationId）；fresh=另开新会话，用于跨会话记忆
# tier      本轮验证哪一层记忆，取值 short-term / mid-term / long-term
#           未实现的层判失败只记「符合当前预期」，实现之后同一份剧本自动转为硬断言
# text      真正发给 /agent/v1/chat 的问题
# expect-any  回答里出现任意一个即算命中，用 | 分隔；留空表示本轮不判回答内容
# expect-tool 本轮期望调用到的工具，只记录不判死——模型是否检索由它自己决定
# forbid-tool 本轮不该调用的工具，调了即判失败；用于「答案必须来自记忆」的轮次
# purpose   报告里的说明文字
#
# 撑量轮的作用是把上下文顶上去，问题取自 enterprise-knowledge-base 模板，跨文档、答案长、必然触发检索。
# 因此本剧本要求环境里已经跑过该模板的初始化，否则检索无内容，上下文涨不起来，裁剪与压缩都永远不触发。
#
# 中期判定用的两条事实（工位号、换新后的资产编号）都只在早期说过一次、后面再没被复述，
# 所以它们一旦被压缩吃掉，正确答案就只可能来自摘要——这是关键词式断言唯一站得住的形态。

anchor=EMP-7731
turn.refs=t01,t02,t03,t04,t05,t06,t07,t08,t09,t10,t11,t12,t13,t14,t15

# ---- 锚点：植入一条知识库里绝对查不到的事实，后面全靠它判定记忆 ----
turn.t01.session=main
turn.t01.tier=short-term
turn.t01.purpose=植入锚点事实（库内不存在，只能来自对话本身）
turn.t01.text=先记一下我的情况：我工号 EMP-7731，下周一入职做 Java 工程师，配的笔记本资产编号是 NB-2049。后面的问题都按我这个身份回答。
turn.t01.expect-any=EMP-7731|收到|记住|好的

# ---- 撑量：六轮跨文档检索，把工具结果堆进上下文 ----
# 工位号只在这一轮说、后面再不复述：它是 t09 唯一站得住的证据，掺进 t01 会被 t08 的复述带回近期上下文
turn.t02.session=main
turn.t02.tier=short-term
turn.t02.purpose=撑量：入职时间线，跨文档抽取；顺带植入只说一次的工位号
turn.t02.text=为了让我入职当天拿到电脑、完成培训，并且第一个月不漏关键节点，HR、IT 和经理分别最晚什么时候做什么？顺便记一下，我的工位号是 B3-1207。
turn.t02.expect-tool=search_knowledge

turn.t03.session=main
turn.t03.tier=short-term
turn.t03.purpose=撑量：离职清单，跨知识库多子问题
turn.t03.text=顺便也讲讲反面：一名已转正员工准备离职，请按时间顺序列出从提交申请到最后一天需要完成的人事、工作交接、资产、账号和 OA 权限动作。
turn.t03.expect-tool=search_knowledge

turn.t04.session=main
turn.t04.tier=short-term
turn.t04.purpose=撑量：数据分级，多角色对比
turn.t04.text=OA 工资附件和保险理赔病历都属于高敏材料。主管和理赔专员分别能看到什么、下载需要什么条件、泄露后靠什么追责？
turn.t04.expect-tool=search_knowledge

turn.t05.session=main
turn.t05.tier=short-term
turn.t05.purpose=撑量：晋升路径，条件组合
turn.t05.text=我不想带团队，但计划一年内从 P5 升到 P6。应该选择哪条发展通道、准备哪些可验证成果、经过哪些审批？
turn.t05.expect-tool=search_knowledge

turn.t06.session=main
turn.t06.tier=short-term
turn.t06.purpose=撑量：考勤判定，规则推理
turn.t06.text=如果我某天工作到零点二十并且已登记、主管也确认了，第二天十二点四十到公司算迟到吗？补偿原则是什么？
turn.t06.expect-tool=search_knowledge

turn.t07.session=main
turn.t07.tier=short-term
turn.t07.purpose=撑量：接口风控，否决性判断
turn.t07.text=再问个技术上的：合作医院请求来自白名单 IP，但签名校验失败且 Nonce 重复，能不能先入库再补验？应该怎么处置？
turn.t07.expect-tool=search_knowledge

# ---- 判定：上下文已被撑大（可能已裁剪），锚点必须还在 ----
turn.t08.session=main
turn.t08.tier=short-term
turn.t08.purpose=短期记忆判定：撑量之后仍能复述第一轮的锚点
turn.t08.text=把我的工号和笔记本资产编号原样念一遍，然后按你前面讲的入职流程，说清楚这台电脑是谁在哪一步交给我。
turn.t08.expect-any=EMP-7731

# ---- 判定：早期原文已被压缩换成摘要，只说过一次的事实必须原样活在摘要里 ----
turn.t09.session=main
turn.t09.tier=mid-term
turn.t09.purpose=中期记忆判定：被压缩掉的用户原话是否 verbatim 活在摘要里
turn.t09.text=只依据我们前面已经聊过的内容，不要重新检索：我的工位号是多少？另外，离职那一轮你引用的资料里关于资产归还写了哪几条？
# 工位号只在 t02 出现过一次，库里查不到、问题里也没带，答对只可能来自摘要
turn.t09.expect-any=B3-1207
# 重查一遍就说明摘要没把工具结论带过来，模型只能回头再问一次知识库
turn.t09.forbid-tool=search_knowledge

# ---- soak：再撑三轮把压缩逼到第二、三代，其中先给出一条与早期冲突的更正 ----
turn.t10.session=main
turn.t10.tier=short-term
turn.t10.purpose=植入冲突事实：资产编号被更正，验「与新记录冲突时以新记录为准」
turn.t10.text=补充一下情况：原来那台笔记本坏了，公司换了新的给我，资产编号从 NB-2049 变成 NB-3160，后面都按新的算。

turn.t11.session=main
turn.t11.tier=short-term
turn.t11.purpose=撑量：薪酬福利，跨文档条件组合
turn.t11.text=试用期薪资怎么算、五险一金按什么基数缴、年终奖发放要满足哪些条件，如果我年中离职这几项分别怎么处理？
turn.t11.expect-tool=search_knowledge

turn.t12.session=main
turn.t12.tier=short-term
turn.t12.purpose=撑量：IT 支持与资产责任，跨文档
turn.t12.text=笔记本在保修期内出故障应该怎么报修、能不能借备用机、维修期间这台设备的资产责任算谁的？
turn.t12.expect-tool=search_knowledge

turn.t13.session=main
turn.t13.tier=short-term
turn.t13.purpose=撑量：开票与报销，跨知识库
turn.t13.text=客户要求开增值税专用发票需要我们提供哪些信息，我垫付的差旅费报销要走哪些审批、多久到账？
turn.t13.expect-tool=search_knowledge

# ---- 判定：跨代摘要必须带上更正后的值，而不是把第一代那个旧值一路抄下去 ----
turn.t14.session=main
turn.t14.tier=mid-term
turn.t14.purpose=中期记忆判定：多代摘要之间冲突取新，旧值不得被逐代复制
turn.t14.text=只依据我们前面聊过的内容，不要重新检索：我现在手上这台笔记本的资产编号是多少？
turn.t14.expect-any=NB-3160
turn.t14.forbid-tool=search_knowledge

# ---- 判定：另开一条会话，锚点应当来自长期记忆而非上下文 ----
turn.t15.session=fresh
turn.t15.tier=long-term
turn.t15.purpose=长期记忆判定：新会话里仍认得上一条会话建立的身份
turn.t15.text=我的工号是多少？我那台笔记本的资产编号呢？
turn.t15.expect-any=EMP-7731
