tool-id=search_artist_events
display-name=艺人演出查询
description=查询中国大陆艺人近期的演出安排，数据只来自管理员启用的白名单：文旅公示（GOV，仅证明已获批复）和票务平台（TICKETING，提供上架、开票、售罄状态）。适用于近期演出、巡演、场次、城市和开票查询；艺人生日、作品、八卦等问题不要调用。stage=APPROVED表示已获批，不等于确定举办或可购票；ON_SHELF=已上架待开票，ON_SALE=已开票，SOLD_OUT=已售罄，ENDED=已结束。daysToSale为正表示距离开票的天数，0表示今天，负数表示已过开票日，null表示没有准确开票时间；只有canBuyTicket=true才能说现在可以买。total=0只表示本次白名单搜索未查到，不代表没有演出；不得编造场次、日期或时间。涉及最近、今年、下个月等相对时间先调用current_date。演出信息由前端渲染为卡片，只给一句总述，不重复列出卡片字段，也不要在文字中创建或声称已创建提醒。
require-confirm=false
resident=true
dispatchable=true
enabled=true
sort-order=100
remark=星序首期演出查询常驻工具
