tool-id=search_artist_events
display-name=艺人演出查询
description=发现艺人的演出/巡演安排，city可省略；未指定城市时不补填城市，不调用plan_event_journey。仅从数据库启用的公开白名单检索，默认window=year（未来365天），recent=未来90天，all=未来730天；includeEnded默认false。多查询、多城市、一页多场次；pageSize默认20上限50，nextCursor可加载更多。coverage和notes说明窗口、查询/来源数、过滤、截断及提供方限制，只能说本次检索到的，不得称全部或保证覆盖。dateUnknown表示日期待核实，不能用候选年份当确定演出日；未知场馆/开场不能补造。GOV/APPROVED仅证明许可；TICKETING提供ON_SHELF待开票、ON_SALE已开票、SOLD_OUT售罄、ENDED已结束状态，只有canBuyTicket=true才能说现在可以买；isStale/conflict时必须核验，不自动创建提醒。total=0不表示没有演出。相对时间先用current_date。前端渲染卡片，只给一句总述和覆盖限制，不重复卡片，也不声称已创建提醒。艺人生日/作品/八卦问题不要调用。
require-confirm=false
resident=true
dispatchable=true
enabled=true
sort-order=100
remark=星序首期演出查询常驻工具
