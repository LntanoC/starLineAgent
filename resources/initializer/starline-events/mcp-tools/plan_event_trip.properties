tool-id=plan_event_trip
display-name=观演出行规划
description=根据演出时间与出发地倒推最晚出发时间并给出高德分段路线耗时。适用于“几点得从家走”“从车站到场馆要多久”“会不会迟到”；不适用于行程编排、景点推荐、订票订房。必须先调用 search_artist_events 核实演出；该工具目前只提供演出日期，不含结构化场馆和开场时间。若搜索结果或用户信息里缺少具体场馆或准确开场时间，先向用户确认，不得把演出日期当作开场时间或自行假设场馆。路线耗时来自高德路径规划，不含实时拥堵，并建议额外预留 15 分钟；城际火车或航班时刻不由本工具查询，也不得编造车次号、航班号或发车时间。未提供城际到达时间时只计算所填出发地至场馆的路线，latestDeparture 指该出发地；提供 intercityArrivalTime 和 intercityArrivalPlace 时只计算到达地点至场馆的路线，latestDeparture 指该到达地点，城际行程仍由用户自行确认。assumptions 必须原样转述；confidence=MEDIUM 表示高德路线覆盖自驾段但仍需预留路况误差；confidence=LOW 表示只包含市内路线且城际行程未包含。
require-confirm=false
resident=false
dispatchable=true
enabled=true
