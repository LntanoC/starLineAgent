description=规划城市或地址之间的普通出行，返回 trip-plan.v3 分段时间轴、交通方式、费用明细、人均/同行合计、可行性与来源。必须提供 departAt 或 arriveBy 二选一；城市定位点会明确标注。支持铁路/市内公共交通、自驾、打车和短途步行；航班与大巴专用时刻尚未接入。未知金额为 null，不能说成零；参考价不是实价。FAILED 才表示无可用结果；NEEDS_CLARIFICATION 请按 questions 追问，PARTIAL 仍应展示可用方案。观演场景调用 plan_event_journey，不订票、不承诺余票。
