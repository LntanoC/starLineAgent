description=为已签收的订单发起退货退款、换货或仅退款申请，如：这个想退了、屏幕有划痕要换货、东西没收到要退款。订单号、商品型号、售后类型与原因取自用户明确说明，缺哪一项先追问；签收七天内任何理由都收，第 8 到 15 天只收质量问题且仅限退货退款或换货，超过 15 天走保修；落在哪一档由工具判定，不要自行推算天数
examples=上次买的手机我想退货|耳机有问题想换一个|这单帮我申请退款|签收的那件东西要退
