# 演示问题模板
# 初始化完成后串行提问一遍，同时按 question.refs 的顺序写入示例问题表
# title 与 description 用于欢迎页卡片，text 是真正发送给对话接口的问题
# follow-ups 用 | 分隔，与 text 同属一个会话，按顺序在 text 之后追问，不进示例问题表
# 提问顺序每次随机，问题之间没有先后依赖，追问只依赖同一问题的上一轮
#
# 这里只放知识型问法，预热调用 /agent/v1/chat
# 办事类问题可能触发写操作确认，欢迎页卡片不放这类问题
# 查订单、查物流等实时数据依赖演示业务库当前状态，不适合作为固定问题

