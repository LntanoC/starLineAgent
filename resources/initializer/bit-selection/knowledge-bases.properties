# 四个知识库按「问的是什么」分，不按「哪个品类」分
# 品类切分会让「A15 保修多久」这类跨层问题落不进任何一个库，
# 而按问题层次切，检索作用域正好与意图树的售前 / 使用 / 售后三段对齐
knowledge-base.refs=product,manual,policy,faq

# 商品详情与选购指南：静态规格与搭配建议，实时价格库存走 MCP 工具不走这里
knowledge-base.product.name=商品与导购
knowledge-base.product.collection-name=bit_product
knowledge-base.product.embedding-model=qwen-emb-8b
knowledge-base.product.documents=docs/knowledge/product

# 用户手册、配网与 App 操作：买回去以后怎么用
knowledge-base.manual.name=使用手册
knowledge-base.manual.collection-name=bit_manual
knowledge-base.manual.embedding-model=qwen-emb-8b
knowledge-base.manual.documents=docs/knowledge/manual

# 退换货、保修、物流、发票会员与促销：平台规则，判定口径以这里为准
knowledge-base.policy.name=平台政策
knowledge-base.policy.collection-name=bit_policy
knowledge-base.policy.embedding-model=qwen-emb-8b
knowledge-base.policy.documents=docs/knowledge/policy

# 故障排查与错误码：出问题以后怎么自查
knowledge-base.faq.name=常见问题
knowledge-base.faq.collection-name=bit_faq
knowledge-base.faq.embedding-model=qwen-emb-8b
knowledge-base.faq.documents=docs/knowledge/faq
