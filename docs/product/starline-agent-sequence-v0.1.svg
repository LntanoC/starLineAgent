<rect x="56" y="2595" width="1908" height="70" rx="12" fill="#eef2f8" stroke="#cbd5e1"/><text x="78" y="2623" class="noteTitle">异步提醒调度</text><text x="78" y="2648" class="note">到期查询有效提醒并发送通知，成功后更新状态；CANCELLED 提醒跳过。通知渠道和提前量仍需产品定义。</text>
